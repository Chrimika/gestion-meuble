name: Build Windows .exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build .exe (static export + electron-builder)
        run: node scripts/build-electron.js win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResidenceStRaphael-Windows-Setup
          path: dist-electron/*.exe
          retention-days: 90

      - name: Create public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Résidence St Raphaël v1.0.${{ github.run_number }}"
          body: "Logiciel de gestion financière — Résidence St Raphaël, Yaoundé"
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
